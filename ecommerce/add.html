<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thêm Sản Phẩm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-action { transition: all .15s ease; }
    .btn-action:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .btn-action:active { transform: translateY(0); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-5 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Thêm Sản Phẩm</h1>
        <p class="text-blue-200 text-sm mt-1">Nhập thông tin sản phẩm mới</p>
      </div>
      <a href="index.html" class="px-5 py-2 bg-white/10 text-white font-semibold rounded-lg hover:bg-white/20 transition btn-action flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Quay lại
      </a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-md p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Thêm sản phẩm mới
      </h2>
      <form id="productForm">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="productId" class="block text-sm font-medium text-gray-700 mb-1">Mã sản phẩm</label>
            <input type="text" id="productId" placeholder="VD: SP001"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
          </div>
          <div>
            <label for="productName" class="block text-sm font-medium text-gray-700 mb-1">Tên sản phẩm</label>
            <input type="text" id="productName" placeholder="Tên sản phẩm"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
          </div>
          <div>
            <label for="productCategory" class="block text-sm font-medium text-gray-700 mb-1">Danh mục</label>
            <select id="productCategory"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white">
              <option value="">-- Chọn danh mục --</option>
              <option value="Điện thoại">Điện thoại</option>
              <option value="Laptop">Laptop</option>
              <option value="Phụ kiện">Phụ kiện</option>
              <option value="Máy tính bảng">Máy tính bảng</option>
              <option value="Đồng hồ">Đồng hồ thông minh</option>
            </select>
          </div>
          <div>
            <label for="productPrice" class="block text-sm font-medium text-gray-700 mb-1">Giá bán (₫)</label>
            <input type="number" id="productPrice" placeholder="0" min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
          </div>
          <div>
            <label for="productQty" class="block text-sm font-medium text-gray-700 mb-1">Số lượng</label>
            <input type="number" id="productQty" placeholder="0" min="0"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
          </div>
        </div>
        <div class="flex gap-3 mt-6">
          <button type="submit"
            class="px-6 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition btn-action">
            Thêm mới
          </button>
          <a href="index.html"
            class="px-6 py-2 bg-gray-400 text-white font-medium rounded-lg hover:bg-gray-50 transition btn-action inline-flex items-center">
            Hủy
          </a>
        </div>
      </form>
    </div>
  </main>

  <script src="storage.js"></script>
  <script src="add.js"></script>
</body>
</html>
