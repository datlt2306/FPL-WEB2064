<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản Lý Sản Phẩm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .btn-action { transition: all .15s ease; }
    .btn-action:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .btn-action:active { transform: translateY(0); }
    tr { transition: background .15s ease; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-5 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Quản Lý Sản Phẩm</h1>
        <p class="text-blue-200 text-sm mt-1">Thêm, sửa, xóa và tìm kiếm sản phẩm</p>
      </div>
      <a href="add.html" class="px-5 py-2 bg-white text-blue-700 font-semibold rounded-lg hover:bg-blue-50 transition btn-action flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Thêm sản phẩm
      </a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Toolbar -->
    <div class="bg-white rounded-xl shadow-md p-4">
      <div class="flex flex-col md:flex-row gap-3 items-start md:items-center">
        <span id="productCount" class="text-sm text-gray-500 whitespace-nowrap"></span>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600 w-12">#</th>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600">Mã SP</th>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600">Tên sản phẩm</th>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600">Danh mục</th>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600 text-right">Giá bán</th>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600 text-right">Số lượng</th>
              <th class="px-4 py-3 text-sm font-semibold text-gray-600 text-center w-28">Thao tác</th>
            </tr>
          </thead>
          <tbody id="productTableBody" class="divide-y divide-gray-100">
          </tbody>
        </table>
      </div>
      <div id="emptyState" class="hidden py-16 text-center">
        <svg class="mx-auto w-16 h-16 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        <p class="mt-3 text-gray-500" id="emptyText">Chưa có sản phẩm nào.</p>
      </div>
    </div>

  </main>

  <script src="storage.js"></script>
  <script src="index.js"></script>
</body>
</html>
