<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Product List</h1>
    <a href="./add.html">Them</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Ten San pham</th>
                <th>Gia</th>
                <th>Trang thai</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="productList">
            
        </tbody>
    </table>

    <script>
        const productList = document.querySelector('#productList');
        fetch('http://localhost:3000/products')
            .then(res => res.json())
            .then(data => {
                productList.innerHTML = data.map((item,index) => {
                    return `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.name}</td>
                            <td>${item.price}</td>
                            <td>
                            ${item.status === true ? 'Con hang': 'Het Hang'}
                            </td>
                            <td>
                                <button onClick="deleteProduct(${item.id})">Xoa</button>  
                                <a href="./edit.html?id=${item.id}">Sua</a>  
                            </td>
                        </tr>
                    `
                }).join("")
            })
        
            const deleteProduct = (id) => {
                const confirm = window.confirm('Xac nhan xoa?');
                if(!confirm) return;
                fetch(`http://localhost:3000/products/${id}`, {
                    method: "DELETE"
                })
            }
    </script>
</body>
</html>
