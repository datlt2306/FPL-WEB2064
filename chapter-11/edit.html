<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Bootstrap demo</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
    <body>
        <div class="container">
            <div class="d-flex justify-content-between align-items-center py-4">
                <h2>Cập nhật sản phẩm</h2>
            </div>
            <form id="product-form-edit">
                <div class="form-group">
                    <label for="name">Tên sản phẩm</label>
                    <input type="text" class="form-control" id="name" name="name" />
                </div>
                <div class="form-group">
                    <label for="price">Giá</label>
                    <input type="number" class="form-control" id="price" name="price" />
                </div>
                <button type="submit" class="btn btn-primary">Thêm</button>
            </form>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="./main.js"></script>
    </body>
</html>
<!-- 
Bước 1: Lấy được id trên url
Bước 2: dùng id để lấy thông tin sản phẩm từ server (API)
Bước 3: Hiển thị thông tin sản phẩm lên form
Bước 4: nhập thông tin sản phẩm vào form
Bước 5: gửi thông tin sản phẩm đến server (API)
Bước 6: Hiển thị thông báo thành công
Bước 7: Hiển thị thông báo lỗi
Bước 8: Chuyển hướng về trang danh sách sản phẩm
-->
